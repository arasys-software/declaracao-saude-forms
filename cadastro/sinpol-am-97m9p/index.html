<meta name="theme-color" content="#470D23">
<title>Vida e Saúde · Cadastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Cadastro de beneficiários · v1.0
   Mesmo visual do formulário da Declaração de Saúde: folha branca sobre fundo rosado, cabeçalho com as logos.
   O titular preenche os dados dele e dos dependentes; o envio vai para a função cadastro-beneficiarios. */
:root{
  color-scheme:light;
  --page:#F6F3F3; --sheet:#FFFFFF; --soft:#FAF7F7; --tint:#F6EDEF;
  --ink:#2A2224; --title:#470D23; --muted:#6B6264; --line:#E8E2E3; --field:#948A8C;
  --brand:#470D23; --brand-h:#5C1230; --rose:#9A585C; --on:#FFFFFF;
  --warn:#7A4A00; --warn-bg:#FFF6E5; --err:#B42318; --err-bg:#FEF3F2; --ok:#1F6B45; --ok-bg:#EAF6EF;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --shadow:0 1px 2px rgba(42,34,36,.04),0 12px 32px -16px rgba(42,34,36,.16);
  --ring:0 0 0 3px rgba(71,13,35,.16);
  --head:"Urbanist","Segoe UI",system-ui,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1 0 auto;width:100%}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid rgba(71,13,35,.6);outline-offset:2px}
.top{background:var(--sheet);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.top img{height:40px;width:auto;display:block}
.top .emp{display:flex;align-items:center;gap:10px;min-width:0;text-align:right}
.top .emp b{font-family:var(--head);font-weight:600;font-size:.95rem;color:var(--title);line-height:1.3;max-width:min(55vw,320px);overflow-wrap:anywhere}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-top:20px}
.sec{padding:24px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
@media (max-width:560px){.sec{padding:20px 16px}}
h1{font-family:var(--head);font-size:clamp(1.5rem,1.2rem + 1.2vw,1.85rem);line-height:1.18;margin:0;color:var(--title);font-weight:700;text-wrap:balance}
h2{font-family:var(--head);font-size:1.1rem;margin:0;color:var(--title);font-weight:700;text-wrap:balance}
h3{font-family:var(--head);font-size:.98rem;margin:0;color:var(--title);font-weight:700}
.lead{margin:12px 0 0;max-width:62ch;text-wrap:pretty}
.hint{color:var(--muted);margin:4px 0 0;font-size:.9rem;text-wrap:pretty}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 16px;margin-top:16px}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
@media (max-width:640px){.c4,.c3,.c2{grid-column:span 6}}
label{display:block;font-size:.88rem;font-weight:600;margin-bottom:6px}
label .opt{font-weight:400;color:var(--muted)}
input,select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--sheet);border:1px solid var(--field);border-radius:var(--r-sm);padding:10px 12px;min-height:48px}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
input[readonly]{background:var(--soft);color:var(--muted)}
.f.bad input,.f.bad select{border-color:var(--err);background:var(--err-bg)}
.msg{font-size:.82rem;margin-top:5px;color:var(--muted)}
.msg:empty{display:none}
.f.bad .msg{color:var(--err)}
.f.good .msg{color:var(--ok)}
.f.warn .msg{color:var(--warn)}
.help{display:flex;gap:10px;align-items:flex-start;background:var(--tint);border-radius:var(--r-md);padding:12px 14px;font-size:.86rem}
.help svg{flex:none;margin-top:2px}
.help a{color:var(--title);font-weight:600}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:520px){.plans{grid-template-columns:1fr}}
.plan{position:relative;display:block;border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px 16px;cursor:pointer;font-weight:400;margin:0;transition:border-color .18s,background-color .18s}
.plan input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-height:0}
.plan b{display:block;font-family:var(--head);font-size:1.05rem;color:var(--title)}
.plan span{display:block;font-size:.86rem;color:var(--muted);margin-top:2px}
.plan:has(input:checked){border-color:var(--brand);background:var(--tint)}
.plan:has(input:focus-visible){box-shadow:var(--ring)}
.plans.bad .plan{border-color:var(--err)}
.person-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tag{display:inline-block;font-size:.78rem;font-weight:600;color:var(--title);background:var(--tint);border-radius:999px;padding:2px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;border-radius:var(--r-md);padding:11px 20px;min-height:48px;cursor:pointer;border:1px solid var(--brand);text-decoration:none;transition:background-color .18s}
.btn.primary{background:var(--brand);color:var(--on)}
.btn.primary:hover{background:var(--brand-h)}
.btn.ghost{background:var(--sheet);color:var(--title)}
.btn.ghost:hover{background:var(--tint)}
.btn[disabled]{opacity:.6;cursor:wait}
.link{background:none;border:0;color:var(--err);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;padding:10px 4px;min-height:44px}
.inherit{margin-top:14px;font-size:.88rem;color:var(--muted);background:var(--soft);border:1px dashed var(--line);border-radius:var(--r-md);padding:10px 12px}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:400;font-size:.95rem;margin:0;border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;cursor:pointer}
.check input{width:20px;height:20px;min-height:0;margin:2px 0 0;accent-color:var(--brand);flex:none}
.check.bad{border-color:var(--err);background:var(--err-bg)}
.actions{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.alert{border-radius:var(--r-md);padding:12px 14px;font-size:.92rem;margin-top:14px}
.alert.err{background:var(--err-bg);color:var(--err)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.rev{width:100%;border-collapse:collapse;font-size:.9rem}
.rev th,.rev td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.rev th{color:var(--muted);font-weight:600;width:42%}
.rev-p{margin-top:18px}
.rev-p:first-child{margin-top:0}
.proto{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;background:var(--tint);border-radius:var(--r-md);padding:14px 16px}
.proto b{font-family:var(--head);font-size:1.3rem;color:var(--title);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.state{text-align:center;padding:48px 24px}
.spin{width:28px;height:28px;border:3px solid rgba(71,13,35,.15);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}*{transition:none!important}}
footer{text-align:center;font-size:.8rem;color:var(--muted);padding:24px 16px 32px}
</style>
</head>

async function api(action,data,ms=20000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,empresa:SLUG,...data}),signal:c.signal});
    const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){const e=new Error(j.error||"erro");e.status=r.status;throw e}return j}
  finally{clearTimeout(t)}}
const SLUG=slugDoLink();

/* ---------- validações ---------- */
const dig=s=>String(s||"").replace(/\D/g,"");
function cpfOk(d){d=dig(d);if(!/^\d{11}$/.test(d)||/^(\d)\1+$/.test(d))return false;
  for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+d[i]*(t+1-i);if(((s*10)%11)%10!==+d[t])return false}return true}
function cnsOk(d){d=dig(d);if(!/^\d{15}$/.test(d))return false;
  if(/^[12]/.test(d)){const pis=d.slice(0,11);let s=0;for(let i=0;i<11;i++)s+=+pis[i]*(15-i);let dv=11-s%11;if(dv===11)dv=0;
    if(dv===10){s+=2;dv=11-s%11;return pis+"001"+dv===d}return pis+"000"+dv===d}
  if(/^[789]/.test(d)){let s=0;for(let i=0;i<15;i++)s+=+d[i]*(15-i);return s%11===0}return false}
function idade(t){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t||"");if(!m)return null;const d=+m[1],mo=+m[2],a=+m[3],b=new Date(a,mo-1,d);
  if(b.getDate()!==d||b.getMonth()!==mo-1||b>new Date()||a<1900)return null;const n=new Date();let x=n.getFullYear()-a;
  if(n.getMonth()+1<mo||(n.getMonth()+1===mo&&n.getDate()<d))x--;return x>120?null:x}
const FALSOS=/(^|\.)(mailinator|yopmail|guerrillamail|10minutemail|tempmail|temp-mail|sharklasers|getnada|trashmail|dispostable|fakemail|example|exemplo|teste|test)\.[a-z.]+$/i;
const LOCAIS=/^(teste|test|naotem|nao\.tem|sememail|sem\.email|nenhum|xxx+|aaa+|email|abc|123)$/i;
function emailOk(e){const m=/^([^\s@]+)@([a-z0-9.-]+\.[a-z]{2,})$/i.exec(e||"");return !!m&&!FALSOS.test(m[2])&&!LOCAIS.test(m[1])}

/* ---------- máscaras ---------- */
const MASK={
  cpf:v=>{v=dig(v).slice(0,11);return v.replace(/^(\d{3})(\d)/,"$1.$2").replace(/^(\d{3}\.\d{3})(\d)/,"$1.$2").replace(/^(\d{3}\.\d{3}\.\d{3})(\d)/,"$1-$2")},
  cns:v=>{v=String(v).replace(/[,.]\d{0,2}\s*$/,"");v=dig(v).slice(0,15);return v.replace(/^(\d{3})(\d)/,"$1 $2").replace(/^(\d{3} \d{4})(\d)/,"$1 $2").replace(/^(\d{3} \d{4} \d{4})(\d)/,"$1 $2")},
  nascimento:v=>{v=dig(v).slice(0,8);return v.replace(/^(\d{2})(\d)/,"$1/$2").replace(/^(\d{2}\/\d{2})(\d)/,"$1/$2")},
  cep:v=>{v=dig(v).slice(0,8);return v.replace(/^(\d{5})(\d)/,"$1-$2")},
  cel:v=>{v=dig(v).slice(0,11);return v.length<3?v:v.length<8?`(${v.slice(0,2)}) ${v.slice(2)}`:`(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`}
};

/* ---------- telas ---------- */
const INFO='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#470D23" stroke-width="1.8"/><path d="M12 11v6M12 7.5v.01" stroke="#470D23" stroke-width="2" stroke-linecap="round"/></svg>';
function estado(titulo,texto){app.innerHTML=`<div class="sheet"><div class="state"><h1>${esc(titulo)}</h1><p class="lead" style="margin-inline:auto">${esc(texto)}</p></div></div>`}
const opts=(lista,ph="Selecione")=>`<option value="">${ph}</option>`+lista.map(o=>typeof o==="string"?`<option>${esc(o)}</option>`:`<option value="${o.cod}">${esc(o.rotulo)}</option>`).join("");
let uid=0;
function pessoaHTML(id,tit){
  const f=(k,lab,inner,cls="c3",ajuda="")=>`<div class="f ${cls}" data-f="${k}"><label for="${id}-${k}">${lab}</label>${inner}<div class="msg" id="${id}-${k}-m">${ajuda}</div></div>`;
  const inp=(k,a="")=>`<input id="${id}-${k}" data-k="${k}" ${a}>`;
  return `<div class="sheet pessoa" data-id="${id}" data-tit="${tit?1:0}"><div class="sec">
   <div class="person-h"><div><span class="tag">${tit?"Titular":"Dependente"}</span><h2 style="margin-top:8px">${tit?"Seus dados":"Dados do dependente"}</h2></div>${tit?"":`<button type="button" class="link" data-rm="${id}">Remover</button>`}</div>
   <div class="grid">
    ${tit?"":f("parentesco","Parentesco com você",`<select id="${id}-parentesco" data-k="parentesco">${opts(CFG.parentescos)}</select>`,"c6")}
    ${f("nome","Nome completo",inp("nome",`autocomplete="${tit?"name":"off"}" autocapitalize="words"`),"c6")}
    ${f("cpf","CPF",inp("cpf",'inputmode="numeric" autocomplete="off" placeholder="000.000.000-00"'),"c3")}
    ${f("cns","Cartão Nacional de Saúde (CNS)",inp("cns",'inputmode="numeric" autocomplete="off" placeholder="000 0000 0000 0000"'),"c3")}
    <div class="c6 help">${INFO}<div><b>Onde encontro o CNS?</b> No <a href="https://meususdigital.saude.gov.br" target="_blank" rel="noopener">Meu SUS Digital</a> (aplicativo ou site, entrando com a conta gov.br, em "Cartão do SUS"), no verso do cartão do SUS ou na unidade de saúde, levando o CPF. São 15 números.</div></div>
    ${f("nascimento","Data de nascimento",inp("nascimento",'inputmode="numeric" autocomplete="off" placeholder="dd/mm/aaaa"'),"c2")}
    ${f("sexo","Sexo",`<select id="${id}-sexo" data-k="sexo">${opts([{cod:"F",rotulo:"Feminino"},{cod:"M",rotulo:"Masculino"}])}</select>`,"c2")}
    ${f("estado_civil","Estado civil",`<select id="${id}-estado_civil" data-k="estado_civil">${opts(CFG.estados_civis)}</select>`,"c2")}
    ${f("naturalidade","Naturalidade (cidade onde nasceu)",inp("naturalidade",'autocomplete="off" placeholder="Ex.: Manaus" autocapitalize="words"'),"c3")}
    ${f("nome_mae","Nome completo da mãe",inp("nome_mae",'autocomplete="off" autocapitalize="words"'),"c3")}
    ${tit?`
    ${f("celular","Celular (WhatsApp)",inp("celular",'type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(92) 99999-9999"'),"c6")}
    ${f("email","E-mail",inp("email",'type="email" inputmode="email" autocomplete="email" placeholder="nome@email.com"'),"c3")}
    ${f("email2","Confirme o e-mail",inp("email2",'type="email" inputmode="email" autocomplete="off" placeholder="Digite o e-mail de novo"'),"c3")}
    ${f("cep","CEP",inp("cep",'inputmode="numeric" autocomplete="postal-code" placeholder="00000-000"'),"c2")}
    ${f("logradouro","Rua / avenida",inp("logradouro",'autocomplete="address-line1"'),"c4")}
    ${f("numero","Número",inp("numero",'inputmode="numeric" autocomplete="off" placeholder="Ex.: 120 ou S/N"'),"c2")}
    ${f("complemento",'Complemento <span class="opt">(opcional)</span>',inp("complemento",'autocomplete="address-line2" placeholder="Casa, bloco, apto."'),"c4")}
    ${f("bairro","Bairro",inp("bairro"),"c2")}
    ${f("cidade","Cidade",inp("cidade"),"c2")}
    ${f("uf","UF",inp("uf",'maxlength="2" autocapitalize="characters"'),"c2")}`:""}
   </div>
   ${tit?"":`<div class="inherit">Endereço, celular, e-mail e plano: os mesmos do titular.</div>`}
  </div></div>`}

function telaForm(){
  app.innerHTML=`
  <form id="form" novalidate>
   <div class="sheet">
    <div class="sec">
     <h1>Cadastro no plano de saúde</h1>
     <p class="lead">Preencha os seus dados e os de cada dependente que vai entrar no plano com você. Com essas informações a Vida e Saúde faz a inclusão de todos.</p>
     <p class="hint" style="margin-top:10px">Tenha em mãos o CPF e o número do Cartão do SUS (CNS) de cada pessoa.</p>
    </div>
    <div class="sec">
     <h2>Plano escolhido</h2>
     <p class="hint">Vale para você e para todos os seus dependentes.</p>
     <div class="plans" id="planos" role="radiogroup" aria-label="Plano">${CFG.planos.map(p=>`<label class="plan"><input type="radio" name="plano" value="${esc(p.id)}"><b>${esc(p.rotulo)}</b><span>${p.id==="enfermaria"?"Internação em quarto coletivo":"Internação em quarto individual"}</span></label>`).join("")}</div>
     <p class="msg" id="msg-plano" style="color:var(--err)"></p>
    </div>
   </div>
   <div id="pessoas"></div>
   <div class="sheet">
    <div class="sec" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
     <div><h3>Vai incluir dependentes?</h3><p class="hint">Cônjuge, filhos e outros parentes que entram no plano com você.</p></div>
     <button type="button" class="btn ghost" id="addDep">+ Adicionar dependente</button>
    </div>
    <div class="sec">
     <label class="check" id="lgpdBox"><input type="checkbox" id="lgpd"><span>Li e autorizo a Vida e Saúde a usar estes dados, meus e dos meus dependentes, para a inclusão e a administração do plano, conforme a LGPD (Lei nº 13.709/2018).</span></label>
     <div class="actions" style="margin-top:16px"><span class="hint" id="resumo"></span><button type="submit" class="btn primary">Conferir antes de enviar</button></div>
     <div id="formErro"></div>
    </div>
   </div>
  </form>`;
  addPessoa(true);
}
function addPessoa(tit){const id="p"+(++uid);$("#pessoas").insertAdjacentHTML("beforeend",pessoaHTML(id,tit));resumo();return id}
function resumo(){const n=$$(".pessoa").length;const r=$("#resumo");if(r)r.textContent=n===1?"1 pessoa no cadastro":`${n} pessoas no cadastro (você + ${n-1} dependente${n>2?"s":""})`}
const val=(p,k)=>{const i=$(`[data-k="${k}"]`,p);return i?i.value.trim():""};

/* ---------- conferência campo a campo ---------- */
function check(f,final){const p=f.closest(".pessoa"),k=f.dataset.f,v=val(p,k),tit=p.dataset.tit==="1";let err="",ok="",warn="";
  if(k!=="complemento"&&!v)err=final?"Campo obrigatório.":"";
  else if(k==="nome"||k==="nome_mae"){if(v.split(/\s+/).length<2)err="Informe o nome completo."}
  else if(k==="cpf"){if(!cpfOk(v))err="CPF inválido. Confira os números.";else if($$(".pessoa").some(o=>o!==p&&dig(val(o,"cpf"))===dig(v)))err="Esse CPF já foi informado para outra pessoa.";else ok="CPF válido."}
  else if(k==="cns"){if(!cnsOk(v))err="CNS inválido. Confira os 15 números no Meu SUS Digital.";else ok="CNS válido."}
  else if(k==="nascimento"){const a=idade(v);if(a===null)err="Data inválida. Use dd/mm/aaaa.";
    else{const par=+val(p,"parentesco");if(tit&&a<18)warn="O titular é menor de idade: a Vida e Saúde vai conferir.";
      else if(!tit&&(par===1||par===6)&&a>=18)warn="Filho(a) ou enteado(a) maior de idade: a Vida e Saúde vai conferir."}}
  else if(k==="naturalidade"){if(v.length<2)err="Informe a cidade onde nasceu."}
  else if(k==="celular"){if(!/^\d{2}9\d{8}$/.test(dig(v)))err="Informe DDD + celular com 9 dígitos, começando com 9."}
  else if(k==="email"){if(!emailOk(v))err="Informe um e-mail válido que você usa."}
  else if(k==="email2"){if(v.toLowerCase()!==val(p,"email").toLowerCase())err="Os e-mails não são iguais."}
  else if(k==="cep"){if(dig(v).length!==8)err="CEP com 8 números."}
  else if(k==="numero"){if(!/^(\d{1,6}[A-Za-z]?|S\/N)$/i.test(v))err="Informe o número (ou S/N se não tiver)."}
  else if(k==="logradouro"&&v.length<3)err="Informe a rua.";
  else if(k==="bairro"&&v.length<2)err="Informe o bairro.";
  else if(k==="uf"&&!/^[A-Za-z]{2}$/.test(v))err="UF com 2 letras.";
  f.classList.toggle("bad",!!err);f.classList.toggle("good",!err&&!!ok);f.classList.toggle("warn",!err&&!!warn);
  const m=$(".msg",f);if(m&&!(k==="cep"&&!err&&m.dataset.cep))m.textContent=err||warn||ok;return !err}

/* ---------- CEP ---------- */
async function buscaCep(el){const p=el.closest(".pessoa"),id=p.dataset.id,m=$("#"+id+"-cep-m");m.dataset.cep=1;m.textContent="Buscando endereço…";
  try{const r=await fetch("https://viacep.com.br/ws/"+dig(el.value)+"/json/").then(x=>x.json());if(r.erro)throw 0;
    const set=(k,v)=>{const i=$("#"+id+"-"+k);if(i&&v){i.value=v;const f=i.closest(".f");if(f.classList.contains("bad"))check(f)}};
    set("logradouro",r.logradouro);set("bairro",r.bairro);set("cidade",r.localidade);set("uf",r.uf);
    m.textContent="Endereço encontrado. Confira e informe o número.";$("#"+id+"-numero").focus()}
  catch(_){m.textContent="Não encontramos esse CEP. Preencha o endereço."}
  finally{delete m.dataset.cep}}

/* ---------- monta o envio ---------- */
function pessoa(p){const o={};["nome","cpf","cns","nascimento","naturalidade","sexo","estado_civil","nome_mae"].forEach(k=>o[k]=val(p,k));
  o.cpf=dig(o.cpf);o.cns=dig(o.cns);return o}
function payload(){const ps=$$(".pessoa"),t=ps[0];const tit=pessoa(t);
  Object.assign(tit,{celular:dig(val(t,"celular")),email:val(t,"email").toLowerCase(),
    endereco:{cep:dig(val(t,"cep")),logradouro:val(t,"logradouro"),numero:val(t,"numero").toUpperCase(),complemento:val(t,"complemento"),bairro:val(t,"bairro"),cidade:val(t,"cidade"),uf:val(t,"uf").toUpperCase()}});
  return {plano:($('input[name="plano"]:checked')||{}).value||"",aceite_lgpd_em:new Date().toISOString(),titular:tit,
    dependentes:ps.slice(1).map(p=>({...pessoa(p),parentesco:+val(p,"parentesco")}))}}
const rotPar=c=>(CFG.parentescos.find(x=>+x.cod===+c)||{}).rotulo||"";
const fmtCpf=d=>d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,"$1.$2.$3-$4");
const fmtCns=d=>d.replace(/^(\d{3})(\d{4})(\d{4})(\d{4})$/,"$1 $2 $3 $4");

function telaRevisao(dados){
  const linha=(k,v)=>`<tr><th>${k}</th><td>${esc(v)}</td></tr>`;
  const bloco=(p,rot)=>`<div class="rev-p"><h3>${esc(rot)}</h3><table class="rev">
    ${p.parentesco?linha("Parentesco",rotPar(p.parentesco)):""}${linha("Nome",p.nome)}${linha("CPF",fmtCpf(p.cpf))}${linha("CNS",fmtCns(p.cns))}
    ${linha("Nascimento",p.nascimento)}${linha("Sexo",p.sexo==="F"?"Feminino":"Masculino")}${linha("Estado civil",p.estado_civil)}
    ${linha("Naturalidade",p.naturalidade)}${linha("Nome da mãe",p.nome_mae)}</table></div>`;
  const t=dados.titular,e=t.endereco,plano=(CFG.planos.find(x=>x.id===dados.plano)||{}).rotulo;
  const rev=document.createElement("div");rev.id="revisao";
  rev.innerHTML=`<div class="sheet"><div class="sec"><h1>Confira antes de enviar</h1>
    <p class="lead">Veja se está tudo certo, principalmente o <b>sexo</b>, o <b>CNS</b> e as datas. Para corrigir, volte ao formulário.</p></div>
    <div class="sec"><table class="rev">${linha("Plano",plano)}${linha("Pessoas",String(1+dados.dependentes.length))}</table></div>
    <div class="sec">${bloco(t,"Titular")}${dados.dependentes.map((d,i)=>bloco(d,"Dependente "+(i+1))).join("")}</div>
    <div class="sec"><table class="rev">${linha("Endereço",[e.logradouro,e.numero,e.complemento,e.bairro,e.cidade+"/"+e.uf].filter(Boolean).join(", "))}${linha("CEP",e.cep.replace(/^(\d{5})(\d{3})$/,"$1-$2"))}
      ${linha("Celular",MASK.cel(t.celular))}${linha("E-mail",t.email)}</table></div>
    <div class="sec"><div class="actions"><button type="button" class="btn ghost" id="corrigir">Corrigir</button><button type="button" class="btn primary" id="enviar">Enviar cadastro</button></div><div id="envioErro"></div></div>
  </div>`;
  $("#form").hidden=true;app.appendChild(rev);scrollTo({top:0});
  $("#corrigir").onclick=()=>{rev.remove();$("#form").hidden=false;scrollTo({top:0})};
  $("#enviar").onclick=async()=>{if(enviando)return;enviando=true;const b=$("#enviar");b.disabled=true;b.textContent="Enviando…";$("#envioErro").innerHTML="";
    try{const r=await api("registrar",{payload:dados,versao:VERSAO},30000);sujo=false;telaFim(r)}
    catch(err){enviando=false;b.disabled=false;b.textContent="Enviar cadastro";
      $("#envioErro").innerHTML=`<div class="alert err">${err.status===422?"Algo precisa ser corrigido: "+esc(err.message)+". Clique em Corrigir.":err.status===429?"Muitos envios seguidos desta conexão. Aguarde alguns minutos e tente de novo.":"Não foi possível enviar. Verifique a internet e tente de novo."}</div>`}}}

function telaFim(r){app.innerHTML=`<div class="sheet"><div class="sec">
  <h1>Cadastro enviado</h1>
  <p class="lead">Recebemos os dados de ${r.vidas===1?"1 pessoa":r.vidas+" pessoas"}. A equipe da Vida e Saúde vai conferir e fazer a inclusão no plano.</p>
  <div class="proto"><span class="hint" style="margin:0">Protocolo</span><b id="protoTxt">${esc(r.protocolo)}</b><button type="button" class="btn ghost" id="copiar" style="min-height:40px;padding:6px 14px">Copiar</button></div>
  <p class="hint" style="margin-top:14px">Guarde o protocolo. Se precisar corrigir algo, faça um novo envio: vale sempre o mais recente.</p>
  </div></div>`;scrollTo({top:0});
  $("#copiar").onclick=()=>{const b=$("#copiar");const ok=()=>{b.textContent="Copiado";setTimeout(()=>b.textContent="Copiar",1800)};
    try{navigator.clipboard.writeText(r.protocolo).then(ok,()=>{})}catch(_){}}}

/* ---------- eventos ---------- */
document.addEventListener("input",e=>{const k=e.target.dataset.k;if(!k)return;sujo=true;
  if(MASK[k])e.target.value=MASK[k](e.target.value);
  const f=e.target.closest(".f");if(f&&f.classList.contains("bad"))check(f,false);
  if(k==="cep"&&dig(e.target.value).length===8)buscaCep(e.target)});
document.addEventListener("change",e=>{const f=e.target.closest&&e.target.closest(".f");if(f&&e.target.tagName==="SELECT")check(f,false);
  if(e.target.dataset.k==="parentesco"){const n=$('[data-f="nascimento"]',e.target.closest(".pessoa"));if(val(e.target.closest(".pessoa"),"nascimento"))check(n,false)}
  if(e.target.name==="plano"){$("#planos").classList.remove("bad");$("#msg-plano").textContent=""}
  if(e.target.id==="lgpd")$("#lgpdBox").classList.remove("bad")});
document.addEventListener("focusout",e=>{const f=e.target.closest&&e.target.closest(".f");if(f&&e.target.value)check(f,false)});
document.addEventListener("click",e=>{const rm=e.target.closest("[data-rm]");if(rm){$(`.pessoa[data-id="${rm.dataset.rm}"]`).remove();resumo()}
  if(e.target.id==="addDep"){const id=addPessoa(false);$("#"+id+"-parentesco").focus();sujo=true}});
document.addEventListener("submit",e=>{if(e.target.id!=="form")return;e.preventDefault();let first=null;
  $$(".pessoa .f").forEach(f=>{if(!check(f,true))first=first||f});
  if(!$('input[name="plano"]:checked')){$("#planos").classList.add("bad");$("#msg-plano").textContent="Escolha o plano.";first=first||$("#planos")}
  if(!$("#lgpd").checked){$("#lgpdBox").classList.add("bad");first=first||$("#lgpdBox")}
  if(first){$("#formErro").innerHTML=`<div class="alert err">Há campos para corrigir. Eles estão marcados em vermelho.</div>`;first.scrollIntoView({behavior:"smooth",block:"center"});
    const i=$("input,select",first);if(i)setTimeout(()=>i.focus({preventScroll:true}),350);return}
  $("#formErro").innerHTML="";telaRevisao(payload())});
window.addEventListener("beforeunload",ev=>{if(sujo){ev.preventDefault();ev.returnValue=""}});

/* ---------- início ---------- */
(async()=>{
  if(!/^[a-z0-9]+(?:-[a-z0-9]+)*-[a-z2-9]{5}$/.test(SLUG)){estado("Use o link enviado pela sua empresa","Este endereço não corresponde a nenhum formulário ativo.");return}
  try{CFG=await api("empresa",{},15000)}
  catch(err){if(err.status===404)estado("Este link não está ativo","Confira se o endereço foi copiado inteiro ou peça um novo link à sua entidade.");
    else estado("Não foi possível carregar","Verifique a internet e recarregue a página.");return}
  $("#empNome").textContent=CFG.nome;document.title="Cadastro · "+CFG.nome;
  if(CFG.logo){const i=$("#empLogo");i.src=CFG.logo;i.alt=CFG.nome;i.hidden=false}
  telaForm()})();
})();
</script>
